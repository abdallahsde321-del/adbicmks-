name: Run 6-Hour Stream via Docker

on:
  workflow_dispatch:

jobs:
  run-docker-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # تحديد مدة التشغيل بـ 6 ساعات كاملة (لحسابات Pro)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tiktok-to-youtube .

      - name: Run Docker Container
        run: |
          docker run --rm \
            -e TIKTOK_URL="${{ secrets.TIKTOK_URL }}" \
            -e YOUTUBE_STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}" \
            tiktok-to-youtube
